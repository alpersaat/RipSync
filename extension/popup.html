<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>RipSync</title>
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 14px;
      background: #1a1b26;
      color: #c0caf5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      border-bottom: 1px solid #292e42;
      padding-bottom: 8px;
    }
    .header h2 {
      margin: 0;
      font-size: 15px;
      color: #7aa2f7;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 6px;
      font-weight: 500;
      margin-bottom: 14px;
      font-size: 12px;
    }
    .status-online {
      background: rgba(158, 206, 106, 0.15);
      color: #9ece6a;
      border: 1px solid rgba(158, 206, 106, 0.4);
    }
    .status-offline {
      background: rgba(247, 118, 142, 0.15);
      color: #f7768e;
      border: 1px solid rgba(247, 118, 142, 0.4);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .status-online .dot { background: #9ece6a; }
    .status-offline .dot { background: #f7768e; }
    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .setting-item label {
      cursor: pointer;
      font-size: 12px;
    }
    input[type="checkbox"] {
      cursor: pointer;
      accent-color: #3d59a1;
    }
    .footer {
      margin-top: 14px;
      padding-top: 8px;
      border-top: 1px solid #292e42;
      font-size: 11px;
      color: #565f89;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>⚡ RipSync Entegrasyonu</h2>
  </div>

  <div id="status-box" class="status-badge status-offline">
    <div class="dot"></div>
    <span id="status-text">Masaüstü Bağlantısı Yok</span>
  </div>

  <div class="setting-item">
    <label for="chk-intercept">İndirmeleri Yakala</label>
    <input type="checkbox" id="chk-intercept">
  </div>

  <div class="setting-item">
    <label for="chk-sniffer">Video Panelini Göster</label>
    <input type="checkbox" id="chk-sniffer">
  </div>

  <div class="setting-item">
    <label for="chk-filter-ads">Reklam/Mini Videoları Yoksay</label>
    <input type="checkbox" id="chk-filter-ads">
  </div>

  <div id="site-section" style="display: none; border-top: 1px dashed #292e42; padding-top: 8px; margin-top: 6px;">
    <div class="setting-item" style="margin-bottom: 2px;">
      <label id="lbl-site" for="chk-site" style="font-weight: 500; color: #7aa2f7;">Bu Sitede Etkin</label>
      <input type="checkbox" id="chk-site">
    </div>
    <div id="site-desc" style="font-size: 10px; color: #565f89; margin-bottom: 6px;"></div>
  </div>

  <div class="footer">
    Port: 127.0.0.1:28710
  </div>

  <script src="popup.js"></script>
</body>
</html>
